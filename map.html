<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YouBike 地圖決策</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root {
    --bg:#F2F4F7; --card:#fff; --line:#E5E7EB; --muted:#6B7280; --navy:#1F2937; --slate:#4B5563;
    --green-bg:#DCFCE7; --green-text:#15803D; --amber-bg:#FEF3C7; --amber-text:#B45309; --red-bg:#FEE2E2; --red-text:#B91C1C;
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif; background:var(--bg); color:#222; height:100vh; display:flex; flex-direction:column; }
  header { background:var(--card); border-bottom:1px solid var(--line); padding:10px 14px; }
  .tabs { display:flex; background:var(--bg); border-radius:12px; padding:4px; gap:4px; }
  .tab { flex:1; padding:9px 0; text-align:center; border-radius:9px; font-size:15px; font-weight:600; color:var(--muted); cursor:pointer; }
  .tab.active { background:var(--card); color:var(--navy); box-shadow:0 1px 3px rgba(0,0,0,.08); }
  .meta { font-size:12px; color:var(--muted); margin-top:8px; }
  .actions { display:flex; gap:8px; margin-top:8px; }
  .toolbtn { background:#F3F4F6; color:var(--slate); border:1px solid var(--line); border-radius:999px; padding:6px 14px; font-size:13px; cursor:pointer; }
  #map { height:50vh; min-height:0; }   /* 地圖高度一半 */
  .legend { position:absolute; right:10px; top:10px; background:#fff; border:1px solid var(--line); border-radius:10px; padding:6px 10px; font-size:12px; z-index:1000; }
  .legend b { color:#2563EB; } .legend .red { color:#E11D48; } .legend .num { color:#374151; }
  .list { background:var(--card); border-top:1px solid var(--line); flex:1; min-height:0; overflow-y:auto; padding:10px 14px; }
  .item { padding:8px 4px; border-bottom:1px solid var(--line); font-size:14px; }
  .item .name { font-weight:600; }
  .item .info { font-size:13px; color:var(--muted); }
  .rec-item { background:#FFF1F2; border-radius:10px; padding:10px; margin-bottom:8px; font-size:14px; }
  .rec-item .name { font-weight:700; color:#E11D48; }
  .badge { display:inline-block; padding:2px 8px; border-radius:8px; font-size:12px; margin-left:6px; }
  .badge.green { background:var(--green-bg); color:var(--green-text); } .badge.yellow { background:var(--amber-bg); color:var(--amber-text); } .badge.red { background:var(--red-bg); color:var(--red-text); }
  .flag-icon { font-size:26px; line-height:26px; text-align:center; }
  .num-icon { background:#374151; color:#fff; border-radius:50%; width:26px; height:26px; text-align:center; line-height:26px; font-weight:700; font-size:13px; }
</style>
</head>
<body>
<header>
  <div class="tabs">
    <div class="tab borrow active" onclick="setMode('borrow')">借車</div>
    <div class="tab return" onclick="setMode('return')">還車</div>
  </div>
  <div class="meta" id="meta">定位中…</div>
  <div class="actions">
    <button class="toolbtn" onclick="locate(true)">📍 重新定位</button>
    <button class="toolbtn" onclick="refreshNow()">立即刷新</button>
  </div>
</header>
<div id="map" style="position:relative;">
  <div class="legend">🔵 你｜🚩 推薦站｜🔢 其他 1–6</div>
</div>
<div class="list" id="list"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const URL = "https://tcgbusfs.blob.core.windows.net/dotapp/youbike/v2/youbike_immediate.json";
const REFRESH_MS = 60000;
const RADIUS_M = 500;
let mode = "borrow";
let pos = null, raw = [], lastFetch = null, locating = false;
let map = null, markers = [];
let nbMap = {};

function level(count){
  if(mode==="borrow") return count>10 ? "green" : (count>=3 ? "yellow" : "red");
  return count>=6 ? "green" : (count>=2 ? "yellow" : "red");
}
const badgeText = {green:"機會高", yellow:"有機會", red:"先不要"};
const badgeColor = {green:"var(--green-text)", yellow:"var(--amber-text)", red:"var(--red-text)"};

function hav(lat1,lon1,lat2,lon2){
  const R=6371, dlat=(lat2-lat1)*Math.PI/180, dlon=(lon2-lon1)*Math.PI/180;
  const a=Math.sin(dlat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dlon/2)**2;
  return 2*R*Math.asin(Math.sqrt(a))*1000;
}
function shortName(n){ return String(n).replace(/^YouBike2\.0_/, ""); }
function dToUser(s){ return hav(pos.lat,pos.lon,s.latitude,s.longitude); }
function distScoreOf(d){ if(d<=250) return 1; if(d>=500) return 0; return 1-(d-250)/250; }
function travelTime(dist_m, kmh){
  const sec = dist_m/(kmh*1000/3600); const halfMin = Math.round(sec/30); const mins = halfMin/2;
  if(mins<1) return "不到1分"; if(mins>=60){ const h=Math.floor(mins/60), m=Math.round(mins%60); return h+"小時"+(m?"約"+m+"分":""); }
  if(mins===Math.floor(mins)) return mins+"分"; return Math.floor(mins)+"分半";
}
function dir4(b){ if(b<45||b>=315) return "北"; if(b<135) return "東"; if(b<225) return "南"; return "西"; }
function bearing(lat1,lon1,lat2,lon2){
  const dlon=(lon2-lon1)*Math.PI/180, y=Math.sin(dlon)*Math.cos(lat2*Math.PI/180);
  const x=Math.cos(lat1*Math.PI/180)*Math.sin(lat2*Math.PI/180)-Math.sin(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.cos(dlon);
  return (Math.atan2(y,x)*180/Math.PI+360)%360;
}

function borrowScore(s){
  const countScore=Math.min(s.available_rent_bikes/10,1), distScore=distScoreOf(dToUser(s));
  const prob=s.available_rent_bikes/s.Quantity, nbScore=Math.min((nbMap[s.sno]||0)/10,1);
  return 0.40*countScore+0.25*distScore+0.20*prob+0.15*nbScore;
}
function returnScore(s){
  const slotRatio=s.available_return_bikes/s.Quantity, distScore=distScoreOf(dToUser(s));
  return 0.55*distScore+0.45*slotRatio;
}
function computeNbMap(){
  nbMap={};
  for(let i=0;i<raw.length;i++){ const a=raw[i]; let sum=0;
    for(let j=0;j<raw.length;j++){ if(i===j) continue; const b=raw[j];
      if(hav(a.latitude,a.longitude,b.latitude,b.longitude)<=500) sum+=b.available_rent_bikes; }
    nbMap[a.sno]=sum; }
}

function locate(manual){
  if(!navigator.geolocation){ setMeta("瀏覽器不支援定位"); return; }
  if(locating) return; locating=true;
  setMeta(manual ? "重新定位中…" : "定位中…");
  navigator.geolocation.getCurrentPosition(
    p => { pos={lat:p.coords.latitude, lon:p.coords.longitude}; setMeta(`定位完成 (${pos.lat.toFixed(4)}, ${pos.lon.toFixed(4)})`); locating=false; initMap(); build(); },
    e => { setMeta("定位失敗："+e.message+"（用預設座標）"); pos={lat:25.04576,lon:121.54748}; locating=false; initMap(); build(); },
    { enableHighAccuracy:false, timeout:20000, maximumAge:60000 }
  );
}

function initMap(){
  if(map) return;
  map = L.map('map').setView([pos.lat,pos.lon], 16);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution:'© OpenStreetMap' }).addTo(map);
}

async function fetchJson(){
  try{
    const r = await fetch(URL); const j = await r.json();
    raw = j.filter(d=>String(d.act)==="1" && d.Quantity>0);
    lastFetch = new Date();
    setMeta(`已刷新 ${lastFetch.toLocaleTimeString()}｜共 ${raw.length} 站`);
    computeNbMap(); build();
  }catch(e){ setMeta("抓取失敗："+e.message); }
}
function refreshNow(){ setMeta("刷新中…"); fetchJson(); }
function setMeta(t){ document.getElementById("meta").textContent=t; }

function build(){
  if(!pos || !raw.length || !map) return;
  const stations = raw;
  const pool500 = stations.filter(s=>dToUser(s)<=RADIUS_M);
  let cand = pool500;
  if(cand.length===0) cand = stations.filter(s=>dToUser(s)<=1000);
  if(mode==="borrow" && !cand.some(s=>s.available_rent_bikes>0)) cand = stations.filter(s=>dToUser(s)<=1000);

  let rec = null;
  if(mode==="borrow"){
    let best=null, bs=-1; for(const s of cand){ const sc=borrowScore(s); if(sc>bs){bs=sc;best=s;} }
    rec = best || stations.reduce((a,s)=>borrowScore(s)>borrowScore(a)?s:a);
  }else{
    const withSlots = cand.filter(s=>s.available_return_bikes>0).sort((a,b)=>dToUser(a)-dToUser(b));
    rec = withSlots[0] || cand.sort((a,b)=>dToUser(a)-dToUser(b))[0] || stations[0];
  }
  if(!rec){ setMeta("附近無可用站"); return; }

  const L2 = stations.filter(s=>s.sno!==rec.sno).map(s=>({s,d:dToUser(s)})).filter(x=>x.d>0).sort((a,b)=>a.d-b.d).slice(0,6).map(x=>x.s);

  // 清空舊標記
  for(const m of markers) map.removeLayer(m);
  markers = [];

  // 使用者藍點
  markers.push(L.circleMarker([pos.lat,pos.lon], {radius:8, color:'#2563EB', fillColor:'#2563EB', fillOpacity:.9}).addTo(map).bindPopup('📍 你'));

  // 推薦站：紅色旗子
  const flag = L.divIcon({className:'flag-icon', html:'🚩', iconSize:[30,30], iconAnchor:[15,30]});
  markers.push(L.marker([rec.latitude,rec.longitude], {icon:flag}).addTo(map).bindPopup(`🚩 ${shortName(rec.sna)}｜${mode==="borrow"?"可借":"空位"} ${mode==="borrow"?rec.available_rent_bikes:rec.available_return_bikes}`));

  // 其他 1–6：編號
  L2.forEach((s,i)=>{
    const num = L.divIcon({className:'num-icon', html:String(i+1), iconSize:[26,26], iconAnchor:[13,26]});
    markers.push(L.marker([s.latitude,s.longitude], {icon:num}).addTo(map).bindPopup(`${i+1}. ${shortName(s.sna)}｜${mode==="borrow"?"可借":"空位"} ${mode==="borrow"?s.available_rent_bikes:s.available_return_bikes}`));
  });

  // 地圖置中於使用者（藍點）
  map.setView([pos.lat,pos.lon], 16);

  // 下方清單
  const mainVal = (s)=> mode==="borrow" ? s.available_rent_bikes : s.available_return_bikes;
  const lvlRec = level(mainVal(rec));
  const recD = dToUser(rec), recDir = dir4(bearing(pos.lat,pos.lon,rec.latitude,rec.longitude));
  const recItem = `<div class="rec-item"><div class="name">🚩 ${shortName(rec.sna)} <span class="badge ${lvlRec}" style="color:${badgeColor[lvlRec]}">${badgeText[lvlRec]}</span></div>
    <div class="info">距你 ${recD.toFixed(0)}m（往${recDir}）${mode==="borrow"?"步行約":"騎車約"}${travelTime(recD, mode==="borrow"?3.5:8)}</div>
    <div class="info">${mode==="borrow"?"可借":"空位"} ${mainVal(rec)}${mode==="return"?"／"+rec.Quantity+"格":""}</div></div>`;
  const items = L2.map((s,i)=>{
    const lvl=level(mainVal(s)), d=dToUser(s), dir=dir4(bearing(pos.lat,pos.lon,s.latitude,s.longitude));
    return `<div class="item"><div class="name">${i+1}. ${shortName(s.sna)} <span class="badge ${lvl}" style="color:${badgeColor[lvl]}">${badgeText[lvl]}</span></div>
      <div class="info">距你 ${d.toFixed(0)}m（往${dir}）${mode==="borrow"?"步行約":"騎車約"}${travelTime(d, mode==="borrow"?3.5:8)}｜${mode==="borrow"?"可借":"空位"} ${mainVal(s)}${mode==="return"?"／"+s.Quantity+"格":""}</div></div>`;
  }).join("");
  document.getElementById("list").innerHTML = recItem + items;
}

function setMode(m){ mode=m; build(); document.querySelector(".tab.borrow").classList.toggle("active",m==="borrow");
  document.querySelector(".tab.return").classList.toggle("active",m==="return"); }

locate();
fetchJson();
setInterval(fetchJson, REFRESH_MS);
</script>
</body>
</html>
