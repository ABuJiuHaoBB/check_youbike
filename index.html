<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YouBike 決策助手</title>
<style>
  :root {
    --bg:#F2F4F7;            /* 頁面底 / 分段槽底 */
    --card:#fff;
    --line:#E5E7EB;
    --muted:#6B7280;
    --navy:#1F2937;          /* 品牌/主色（中性深色） */
    --slate:#4B5563;
    /* 狀態（柔和化） */
    --green-bg:#DCFCE7; --green-text:#15803D;   /* 機會高 */
    --amber-bg:#FEF3C7; --amber-text:#B45309;   /* 有機會 */
    --red-bg:#FEE2E2;   --red-text:#B91C1C;     /* 先不要 */
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif; background:var(--bg); color:#222; }
  header { position:sticky; top:0; background:var(--card); border-bottom:1px solid var(--line); padding:10px 14px; z-index:5; }

  /* 分段控制器（Segmented Control）—— 淺灰槽底，選中=白卡+深字+微陰影，避免警示紅 */
  .tabs { display:flex; background:var(--bg); border-radius:12px; padding:4px; gap:4px; }
  .tab { flex:1; padding:9px 0; text-align:center; border-radius:9px; font-size:15px; font-weight:600; color:var(--muted); cursor:pointer; transition:background .15s, color .15s; }
  .tab.active { background:var(--card); color:var(--navy); box-shadow:0 1px 3px rgba(0,0,0,.08); }

  .meta { font-size:12px; color:var(--muted); margin-top:8px; }

  /* 工具按鈕：淺灰小膠囊（輔助、低頻） */
  .actions { display:flex; gap:8px; margin-top:8px; }
  .toolbtn { background:#F3F4F6; color:var(--slate); border:1px solid var(--line); border-radius:999px; padding:6px 14px; font-size:13px; cursor:pointer; }
  .toolbtn:hover { background:#E5E7EB; }

  main { padding:14px; }

  /* 大卡與卡片：整張可點擊（前往地圖），右上角跳轉箭頭 */
  .big-card { background:var(--card); border-radius:16px; padding:16px; margin-bottom:14px; border:1px solid var(--line); cursor:pointer; }
  .big-card h2 { margin:0 0 4px; font-size:20px; }
  .big-card .dir { font-size:14px; color:var(--muted); }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .card { background:var(--card); border-radius:14px; padding:12px; border:1px solid var(--line); cursor:pointer; }
  .card:hover, .big-card:hover { background:#F9FAFB; }
  .name { font-weight:600; margin:0 0 2px; }
  .chev { float:right; color:#9CA3AF; font-size:18px; line-height:1; }
  .info { font-size:13px; color:var(--muted); }

  /* 車位數：柔和文字色 */
  .count { font-size:18px; font-weight:700; margin:6px 0; }
  .count.green { color:var(--green-text); }
  .count.yellow { color:var(--amber-text); }
  .count.red { color:var(--red-text); }

  /* 狀態標籤：淺底 + 深字（柔和） */
  .badge { display:inline-block; padding:2px 8px; border-radius:8px; font-size:12px; margin-left:6px; }
  .badge.green { background:var(--green-bg); color:var(--green-text); }
  .badge.yellow { background:var(--amber-bg); color:var(--amber-text); }
  .badge.red { background:var(--red-bg); color:var(--red-text); }

  .recommend { background:#FEF3C7; border:1px solid #F5D78C; border-radius:12px; padding:10px 12px; font-size:13px; margin-top:14px; }
</style>
</head>
<body>
<header>
  <div class="tabs">
    <div class="tab borrow active" onclick="setMode('borrow')">借車</div>
    <div class="tab return" onclick="setMode('return')">還車</div>
  </div>
  <div class="meta" id="meta">定位中…</div>
  <div class="actions">
    <button class="toolbtn" onclick="locate(true)">📍 重新定位</button>
    <button class="toolbtn" onclick="refreshNow()">立即刷新</button>
  </div>
</header>
<main>
  <div id="big"></div>
  <div class="grid" id="grid"></div>
  <div class="recommend" id="recommend"></div>
</main>
<script>
const URL = "https://tcgbusfs.blob.core.windows.net/dotapp/youbike/v2/youbike_immediate.json";
const REFRESH_MS = 60000;
const RADIUS_M = 800;
let mode = "borrow";
let pos = null;
let raw = [];
let lastFetch = null;
let locating = false;

// 借車：車>10 綠 / 3-9 黃 / 0-2 紅  還車：空位>5 綠 / 1-4 黃 / 0 紅
function level(count){
  if(mode==="borrow") return count>10 ? "green" : (count>=3 ? "yellow" : "red");
  return count>5 ? "green" : (count>=1 ? "yellow" : "red");
}
const badgeText = {green:"機會高", yellow:"有機會", red:"先不要"};

// ---------- 定位 ----------
function locate(manual){
  if(!navigator.geolocation){ setMeta("瀏覽器不支援定位"); return; }
  if(locating) return;
  locating = true;
  setMeta(manual ? "重新定位中…（若無詢問，請到設定允許 Safari 定位）" : "定位中…");
  navigator.geolocation.getCurrentPosition(
    p => { pos={lat:p.coords.latitude, lon:p.coords.longitude};
           setMeta(`定位完成 (${pos.lat.toFixed(4)}, ${pos.lon.toFixed(4)})`);
           locating=false; build();
           navigator.geolocation.watchPosition(
             q => { pos={lat:q.coords.latitude, lon:q.coords.longitude}; build(); },
             ()=>{}, { enableHighAccuracy:true, maximumAge:10000 });
    },
    e => {
      const msg = e.code===1 ? "定位被拒絕：到『設定 › 隱私權 › 定位服務 › Safari』允許"
               : e.code===2 ? "定位無法取得：網路/GPS 訊號弱，請到空曠處重試"
               : e.code===3 ? "定位逾時：已用預設座標"
               : "定位失敗：已用預設座標";
      setMeta("⚠️ "+msg);
      pos={lat:25.04524, lon:121.54659}; locating=false; build();
    },
    { enableHighAccuracy:false, timeout:20000, maximumAge:60000 }
  );
}

// ---------- 幾何 ----------
function hav(lat1,lon1,lat2,lon2){
  const R=6371, dlat=(lat2-lat1)*Math.PI/180, dlon=(lon2-lon1)*Math.PI/180;
  const a=Math.sin(dlat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dlon/2)**2;
  return 2*R*Math.asin(Math.sqrt(a))*1000;
}
function bearing(lat1,lon1,lat2,lon2){
  const dlon=(lon2-lon1)*Math.PI/180;
  const y=Math.sin(dlon)*Math.cos(lat2*Math.PI/180);
  const x=Math.cos(lat1*Math.PI/180)*Math.sin(lat2*Math.PI/180)-Math.sin(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.cos(dlon);
  return (Math.atan2(y,x)*180/Math.PI+360)%360;
}
function dir4(b){
  if(b<45||b>=315) return "北";
  if(b<135) return "東";
  if(b<225) return "南";
  return "西";
}
function dToUser(s){ return hav(pos.lat,pos.lon,s.latitude,s.longitude); }
// 濾掉多餘的站名前綴（所有站名都以 YouBike2.0_ 開頭）
function shortName(n){ return String(n).replace(/^YouBike2\.0_/, ""); }
// 步行時間（以 3.5km/h ≈ 0.9722 m/s 計算），以 0.5 分鐘為粒度，如「2分半」
function walkTime(dist_m){
  const sec = dist_m / 0.9722;
  const halfMin = Math.round(sec / 30);
  const mins = halfMin / 2;
  if(mins < 1) return "不到1分";
  if(mins >= 60){ const h=Math.floor(mins/60); const m=Math.round(mins%60); return h+"小時"+(m?"約"+m+"分":""); }
  if(mins === Math.floor(mins)) return mins+"分";
  return Math.floor(mins)+"分半";
}

// ---------- 決策分數 ----------
function borrowScore(s){
  const countScore = Math.min(s.available_rent_bikes/10, 1);
  const distScore  = Math.max(0, 1 - dToUser(s)/1000);
  const prob       = s.available_rent_bikes / s.Quantity;
  return 0.45*countScore + 0.20*distScore + 0.20*prob + 0.15*prob;
}
function returnScore(s){
  const slotRatio = s.available_return_bikes / s.Quantity;
  const distScore = Math.max(0, 1 - dToUser(s)/1000);
  return 0.55*distScore + 0.45*slotRatio;
}

// ---------- 抓取 ----------
async function fetchJson(){
  try{
    const r = await fetch(URL); const j = await r.json();
    raw = j.filter(d=>String(d.act)==="1" && d.Quantity>0);
    lastFetch = new Date();
    setMeta(`已刷新 ${lastFetch.toLocaleTimeString()}｜共 ${raw.length} 站`);
    build();
  }catch(e){ setMeta("抓取失敗："+e.message); }
}
function refreshNow(){ setMeta("刷新中…"); fetchJson(); }
function setMeta(t){ document.getElementById("meta").textContent=t; }

// ---------- 主流程（三層 + 推薦站） ----------
function build(){
  if(!pos || !raw.length) return;
  const stations = raw;
  const inRadius = stations.filter(s=>dToUser(s)<=RADIUS_M);

  let rec = null;
  if(mode==="borrow"){
    let best=null, bs=-1;
    for(const s of inRadius){ const sc=borrowScore(s); if(sc>bs){bs=sc;best=s;} }
    rec = best || stations.reduce((a,s)=>borrowScore(s)>borrowScore(a)?s:a);
  }else{
    const withSlots = inRadius.filter(s=>s.available_return_bikes>0)
                              .sort((a,b)=>dToUser(a)-dToUser(b));
    rec = withSlots[0] || inRadius.sort((a,b)=>dToUser(a)-dToUser(b))[0] || stations[0];
  }
  if(!rec){ setMeta("附近無可用站"); return; }

  const nearest = stations.reduce((a,s)=>dToUser(s)<dToUser(a)?s:a);   // 空間錨點（最近站）
  // 第2層（顯示格）：離「使用者」最近的 6 站（含最近站；排除推薦站，避免與大卡重複）
  const L2 = stations.filter(s=>s.sno!==rec.sno).map(s=>({s,d:dToUser(s)}))
                     .filter(x=>x.d>0).sort((a,b)=>a.d-b.d).slice(0,6).map(x=>x.s);
  const L2sorted = L2;   // 已依距離排序

  const excluded = new Set([rec.sno, nearest.sno, ...L2.map(s=>s.sno)]);
  const seen = new Set(); const L3=[];
  const candidates = [];
  for(const s2 of L2){
    for(const s of stations){
      if(excluded.has(s.sno)||seen.has(s.sno)) continue;
      const hop = hav(s2.latitude,s2.longitude,s.latitude,s.longitude);
      if(hop<=500){ candidates.push({s, hop, dUser:dToUser(s)}); }
    }
  }
  candidates.sort((a,b)=>a.dUser-b.dUser);
  let sum=0;
  for(const c of candidates){
    if(sum+c.dUser>500) break;
    if(!seen.has(c.s.sno)){ seen.add(c.s.sno); L3.push(c.s); sum+=c.dUser; }
  }

  // ---------- 渲染（僅大卡/第2層；卡片整張可點擊前往地圖） ----------
  const mainVal = (s)=> mode==="borrow" ? s.available_rent_bikes : s.available_return_bikes;
  const lvlRec = level(mainVal(rec));
  const recD = dToUser(rec), recDir = dir4(bearing(pos.lat,pos.lon,rec.latitude,rec.longitude));
  document.getElementById("big").innerHTML = `
    <div class="big-card" onclick="openMap(${rec.latitude},${rec.longitude},'${shortName(rec.sna)}')">
      <h2>📍 ${shortName(rec.sna)} <span class="badge ${lvlRec}">${badgeText[lvlRec]}</span><span class="chev">›</span></h2>
      <div class="dir">距你 <b>${recD.toFixed(0)}m</b>（往${recDir}）步行約${walkTime(recD)}</div>
      <div class="count ${lvlRec}">${mode==="borrow" ? "可借 "+mainVal(rec) : mainVal(rec)+" / "+rec.Quantity+" 空位"}</div>
      <div class="info">${rec.mday}｜點卡片在地圖顯示</div>
    </div>`;

  const cells = L2sorted.map(s=>{
    const lvl = level(mainVal(s));
    const d = dToUser(s), dir = dir4(bearing(pos.lat,pos.lon,s.latitude,s.longitude));
    return `<div class="card" onclick="openMap(${s.latitude},${s.longitude},'${shortName(s.sna)}')">
      <div class="name">${shortName(s.sna)} <span class="badge ${lvl}">${badgeText[lvl]}</span><span class="chev">›</span></div>
      <div class="info">距你 ${d.toFixed(0)}m（往${dir}）步行約${walkTime(d)}｜${s.mday}</div>
      <div class="count ${lvl}">${mode==="borrow" ? "可借 "+mainVal(s) : mainVal(s)+" / "+s.Quantity+" 空位"}</div>
    </div>`;
  }).join("");
  document.getElementById("grid").innerHTML = cells;

  // ---------- 決策建議 ----------
  const areaBikes = L3.reduce((a,s)=>a+s.available_rent_bikes,0) + L2.reduce((a,s)=>a+s.available_rent_bikes,0);
  let recText;
  if(mode==="borrow"){
    recText = `✅ 前往推薦站「${shortName(rec.sna)}」（${recDir} ${recD.toFixed(0)}m）——車 ${rec.available_rent_bikes}/${rec.Quantity}，走過去保證借得到。<br>`;
    if(mainVal(rec)<=2){
      recText += `<b>備選</b>：附近 ${L2sorted.slice().sort((a,b)=>b.available_rent_bikes-a.available_rent_bikes)[0]?.sna ?? ""}（${L2sorted[0]?.sna?("車 "+L2sorted.sort((a,b)=>b.available_rent_bikes-a.available_rent_bikes)[0].available_rent_bikes):""}）`;
    } else {
      recText += `附近（含第3層）共 ${areaBikes} 台車可借，把握度高。`;
    }
  }else{
    const has = rec.available_return_bikes>0;
    recText = has
      ? `✅ 前往最近可還站「${shortName(rec.sna)}」（${recDir} ${recD.toFixed(0)}m）——空位 ${rec.available_return_bikes}/${rec.Quantity}。<br>附近（含第3層）共 ${areaBikes} 台車可借 → 空位會持續釋出。`
      : `⚠️ 附近都滿了。往${recDir} ${recD.toFixed(0)}m 的「${shortName(rec.sna)}」空位 ${rec.available_return_bikes}/${rec.Quantity}（先不要）；可等車多的站釋出空位。`;
  }
  document.getElementById("recommend").innerHTML = recText;
}

function openMap(lat,lon,name){
  window.location.href = `https://maps.apple.com/?ll=${lat},${lon}&q=${encodeURIComponent(name)}`;
}
function setMode(m){ mode=m; build(); document.querySelector(".tab.borrow").classList.toggle("active",m==="borrow");
  document.querySelector(".tab.return").classList.toggle("active",m==="return"); }

locate();
fetchJson();
setInterval(fetchJson, REFRESH_MS);
</script>
</body>
</html>
